name: Sincronizar Intervals.icu - Trams

on:
  schedule:
    # Cada 2 horas, de 9:00 a 23:00 hora de España (verano, UTC+2). Ver el
    # mismo aviso que en RunTrack: al cambiar a horario de invierno
    # (finales de octubre) esto se desplaza 1 hora más tarde de lo previsto.
    - cron: '0 7,9,11,13,15,17,19,21 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Días hacia atrás a revisar'
        required: false
        default: '14'
      uid:
        description: 'UID de un usuario concreto a sincronizar (vacío = todos)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r .github/scripts/requirements.txt

      - name: Ejecutar sincronizacion
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          LOOKBACK_DAYS: ${{ github.event.inputs.days || '14' }}
          TARGET_UID: ${{ github.event.inputs.uid || '' }}
        run: python .github/scripts/sync_intervals.py
